name: Update Live Vehicle Data

on:
  schedule:
    # Run every 10 minutes (avoid rate limits)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-live-data.yml'  # Only trigger when workflow changes

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Fetch live vehicle data
        run: |
          python scripts/fetch_organillero.py data/live_vehicles.json
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/live_vehicles.json
          git diff --staged --quiet || git commit -m "🔄 Update live vehicle data [skip ci]"
          git push
