# Learn more about brand.yml at https://posit-dev.github.io/brand-yml
meta:
  name:
    full: "Metrobús CDMX Live Tracker"
    short: "MB-Live"
  link:
    github: https://github.com/dar4datascience/Datos-Transporte-CDMX

color:
  palette:
    pink: "#E83E8C"
    blue: "#007BFF"
    cyan: "#17A2B8"
    teal: "#20C997"
    green: "#28A745"
    yellow: "#FFD700"
    orange: "#FF7F50"
    red: "#FF3333"
    purple: "#6F42C1"
    indigo: "#6610F2"
    black: "#1A1A1A"
    white: "#F8F8F8"
  foreground: black
  background: white
  primary: purple
  success: green
  info: cyan
  warning: yellow
  danger: orange
  light: white
  dark: black

typography:
  fonts:
    - family: Quantico
      source: google
      weight: [700]
      style: [normal, italic]
      display: swap
    - family: Share Tech Mono
      source: bunny
      weight: 400
      style: normal
      display: swap
  base:
    family: Monda
    size: 17px
    weight: 400
    line-height: 1.5
  headings:
    family: Quantico
    weight: 400
    line-height: 1.2
    style: normal
  monospace:
    family: Share Tech Mono
    size: 0.9em
    weight: 400

defaults:
  bootstrap:
    defaults:
      my-pink: "$brand-pink"
  shiny:
    theme:
      preset: shiny
      rules: |
        .navbar-brand { color: $my-pink }
